name: watch_next
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.8.6+52

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  delayed_display: ^2.0.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  http: ^1.6.0
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.3.0
  flutter_launcher_icons: ^0.14.4
  share_plus: ^13.2.1
  url_launcher: ^6.3.2
  sliding_up_panel: ^2.0.0+1
  easy_localization: ^3.0.8
  toggle_switch: ^2.3.0
  auto_size_text: ^3.0.0
  firebase_core: ^4.12.1
  firebase_app_check: ^0.4.5+2
  firebase_remote_config: ^6.5.5
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3
  in_app_review: ^2.0.12
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  cloud_firestore: ^6.0.3
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  file_picker: ^12.0.0-beta.7
  csv: ^8.0.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_smol.png"
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  macos:
    generate: true
    image_path: "assets/icon.png"
  

flutter:

  uses-material-design: true

  assets:
    - assets/TMDb.png
    - assets/icon_transparent.png
    - assets/translations/

  fonts:
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Regular.ttf
        - asset: fonts/Raleway-Italic.ttf
          style: italic
        - asset: fonts/Raleway-ExtraBold.ttf
        - asset: fonts/Raleway-Light.ttf
